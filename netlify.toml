# ═══════════════════════════════════════════════════════════════════════
# BLOQUEO DE ARCHIVOS INTERNOS
# ═══════════════════════════════════════════════════════════════════════
# Netlify publica la raiz del repositorio, asi que TODO archivo versionado
# queda servible como URL. Estas rutas son de uso interno y no deben ser
# accesibles desde el sitio publico. Van con force = true para que ganen
# sobre el archivo real en disco.
#
# Critico: scripts/ contiene el prompt editorial de la automatizacion, que
# documenta el modelo de operacion de la empresa. Estuvo accesible en
# produccion; se bloqueo el 4 de agosto de 2026.
#
# Al agregar cualquier carpeta interna nueva al repositorio, agregala aqui.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/seo/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# ─── Redirecciones 301: demanda heredada de TARIMAS → Onepack ───
# El dominio gcm.com.sv era un sitio WordPress de tarimas (hasta Feb/Mar 2026).
# Esas URLs hoy dan 404 pero Google aún las muestra. Las enviamos a Onepack
# (negocio de tarimas) para recuperar al cliente y transferir autoridad SEO.
[[redirects]]
  from = "/tarimas-de-madera/"
  to = "https://www.onepack.com.sv/pallets"
  status = 301
  force = true

[[redirects]]
  from = "/tarimas-de-madera"
  to = "https://www.onepack.com.sv/pallets"
  status = 301
  force = true

[[redirects]]
  from = "/tarimas-plasticas/"
  to = "https://www.onepack.com.sv/pallets"
  status = 301
  force = true

[[redirects]]
  from = "/tarimas-plasticas"
  to = "https://www.onepack.com.sv/pallets"
  status = 301
  force = true

[[redirects]]
  from = "/tarimas/"
  to = "https://www.onepack.com.sv/pallets"
  status = 301
  force = true

[[redirects]]
  from = "/tarimas"
  to = "https://www.onepack.com.sv/pallets"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none';"
