[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none';"

# ═══════════════════════════════════════════════════════════════════════
# CACHE DE ESTATICOS
# ═══════════════════════════════════════════════════════════════════════
# Netlify sirve todo con "public, max-age=0, must-revalidate": cada visita
# revalida hasta las fuentes, que no cambian nunca. El HTML se deja como
# esta (debe revalidar siempre) y tambien css/ y js/, porque sus nombres no
# llevan hash y un cache largo dejaria clientes con la version vieja tras
# un deploy.
[[headers]]
  for = "/avenir-lt-pro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La carpeta de la fuente de marca lleva un espacio en el nombre. Netlify
# compara contra la ruta de la peticion, que llega codificada, asi que la
# forma con espacio literal NO hace match. Verificado en produccion: con
# "/Cook Conthic/*" el archivo salia con max-age=0. Se declaran las dos
# formas por si cambia el comportamiento.
[[headers]]
  for = "/Cook%20Conthic/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Cook Conthic/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imagenes/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/favicons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
